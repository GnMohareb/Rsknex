version: "3.8"
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: devroot
      MYSQL_DATABASE: rsknex
      MYSQL_USER: rsknex
      MYSQL_PASSWORD: rsknexdev
    ports: ["127.0.0.1:3307:3306"]
    volumes: [rsknex_db:/var/lib/mysql]
  app:
    image: php:8.2-apache
    volumes: [".:/var/www/html"]
    ports: ["127.0.0.1:8080:80"]
    depends_on: [db]
volumes:
  rsknex_db:
